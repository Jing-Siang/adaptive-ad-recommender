services:
  postgres:
    image: postgres:16-alpine
    # wal_level=logical is required for Debezium's logical replication (see
    # docs/kafka_cdc_plan.md) -- off by default since it costs a little extra
    # disk/perf overhead Postgres won't pay unless something asks for it.
    # max_wal_senders/max_replication_slots already default to 10 in PG13+,
    # kept explicit here for documentation/headroom, not because they need
    # to change. Applying this needs `docker compose up -d postgres`, not
    # `restart` -- restart reuses the already-running container's stale
    # command, only recreating the container picks up a changed `command:`.
    # The postgres_data volume is untouched either way, no data loss.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=ad_recommender
      - POSTGRES_PASSWORD=ad_recommender
      - POSTGRES_DB=ad_recommender
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Web GUI for browsing Postgres -- opt-in via the `tools` profile, so
  # neither `make infra` nor `make docker-up` starts it; `make pgadmin` does
  # (naming a profiled service explicitly starts it). servers.json
  # pre-registers the postgres service so it shows up in the sidebar
  # without manually re-entering host/port/db each time; the password
  # still has to be typed on first connect (see `make pgadmin`'s output).
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: [tools]
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  # --- Kafka + Debezium CDC (see `make kafka`) --------------------------------
  # Syncs the campaigns table into Pinecone -- see docs/kafka_cdc_plan.md for
  # the full design. Not started by `make infra` (these two services alone
  # pull several hundred MB of JVM images), but `make docker-up` does start
  # them, along with the consumer service below that actually applies the
  # changes -- without it, approved campaigns never become servable.

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "9094:9094" # host-exposed listener for local debugging tools only
    environment:
      # Single-node KRaft mode (no Zookeeper) -- this one container plays
      # both the broker role (stores/serves messages) and controller role
      # (manages cluster metadata, Kafka's own internal replacement for
      # what Zookeeper used to do).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Fixed, not left to auto-generate -- a random cluster ID picked on
      # every container start conflicts with the previous run's ID already
      # stored in the kafka_data volume ("Cluster ID does not match" on the
      # second run). Any valid 22-char base64url UUID works here.
      #
      # NOTE: unprefixed CLUSTER_ID, not KAFKA_CLUSTER_ID -- verified live:
      # the apache/kafka image's entrypoint only reads a small set of
      # unprefixed vars for its own bootstrap logic (this one included),
      # separate from the KAFKA_*-prefixed vars it translates into
      # server.properties. KAFKA_CLUSTER_ID was silently ignored; the
      # container's own logs showed "CLUSTER_ID not set. Setting it to
      # default value" and picked a random one instead.
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data

  connect:
    image: quay.io/debezium/connect:3.6
    hostname: connect
    ports:
      - "8083:8083" # Kafka Connect REST API -- used to register the connector
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: "1"
      # Connect's own state (registered connectors, configs, progress) is
      # stored as Kafka topics, not a local file -- same "durable log over
      # trusting memory" idea as CDC itself, just applied to Connect.
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
    depends_on:
      - kafka
      - postgres

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    # .env's DATABASE_URL/REDIS_URL use localhost, correct for the native
    # `make backend`/`make worker` flow (localhost is host-mapped there)
    # but wrong inside a container, where localhost means "this container
    # itself," not the postgres/redis containers next to it -- override
    # with the docker-network service names, same as the Debezium
    # connector config already does for Postgres.
    environment:
      - DATABASE_URL=postgresql+psycopg://ad_recommender:ad_recommender@postgres:5432/ad_recommender
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend/app:/app/app
      - ./backend/mcp_servers:/app/mcp_servers
      - ./backend/data:/app/data
    depends_on:
      - postgres
      - redis

  worker:
    build: ./backend
    command: rq worker --url redis://redis:6379 campaign_review
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://ad_recommender:ad_recommender@postgres:5432/ad_recommender
    volumes:
      - ./backend/app:/app/app
      - ./backend/mcp_servers:/app/mcp_servers
    depends_on:
      - postgres
      - redis

  # Pinecone sync consumer (same as `make kafka-consumer` natively). Like
  # DATABASE_URL above, .env's KAFKA_BOOTSTRAP_SERVERS (localhost:9094) is
  # the host-exposed listener -- inside the network it's kafka:9092. The
  # connector itself still needs `make kafka-register-connector` once per
  # fresh kafka_data volume.
  consumer:
    build: ./backend
    command: python -m app.campaigns.pinecone_sync_consumer
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://ad_recommender:ad_recommender@postgres:5432/ad_recommender
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ./backend/app:/app/app
    depends_on:
      - kafka
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    # VITE_GOOGLE_CLIENT_ID lives here; .env itself is kept out of the image
    # by .dockerignore. Vite exposes VITE_* vars from the process env too.
    env_file:
      - ./frontend/.env
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  postgres_data:
  kafka_data:
  pgadmin_data:
